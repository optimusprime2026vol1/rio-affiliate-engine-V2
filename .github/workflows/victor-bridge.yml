name: RIO Victor Bridge

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: 'Victor request id'
        required: true
        type: string
      command:
        description: 'Scoped management command from Dr. Victor'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: rio-victor-bridge
  cancel-in-progress: false

jobs:
  victor-command:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Refresh governance/health context
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TELEGRAM_BOT_TOKEN_RIO: ${{ secrets.TELEGRAM_BOT_TOKEN_RIO }}
          TELEGRAM_CHAT_ID_RIO: ${{ secrets.TELEGRAM_CHAT_ID_RIO }}
        run: python scripts/heartbeat.py
      - name: Process Victor management command
        env:
          RIO_VICTOR_REQUEST_ID: ${{ inputs.request_id }}
          RIO_VICTOR_COMMAND: ${{ inputs.command }}
          AWS_BEDROCK_API_KEY: ${{ secrets.AWS_BEDROCK_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: python scripts/victor_direct_command.py
      - name: Persist RIO bridge evidence and validated changes
        if: always()
        run: |
          git config user.name "RIO" && git config user.email "rio@rio-affiliate.bot"
          git add data site scripts rio-dashboard || true
          (git diff --cached --quiet || git commit -m "rio bridge: process Victor management command")
          git pull --rebase --autostash
          git push
