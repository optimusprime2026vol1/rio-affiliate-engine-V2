name: RIO

on:
  push:
    branches: [main]
    paths:
      - 'data/instagram_approval.json'
  schedule:
    - cron: '*/30 * * * *'   # heartbeat: every 30 minutes
    - cron: '0 5 * * *'      # content review: once daily, ~10:30 IST
    - cron: '30 5 * * *'     # product discovery: once daily, ~11:00 IST
    - cron: '30 13 * * *'    # instagram publish: once daily, ~19:00 IST
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      job:
        description: 'Which job to run manually (heartbeat / content-review / discover-products / instagram-publish / telegram-test / all)'
        type: choice
        default: heartbeat
        options: [heartbeat, content-review, discover-products, instagram-publish, telegram-test, all]

permissions:
  contents: write
  issues: write

concurrency: rio-state

jobs:
  heartbeat:
    if: |
      github.event_name == 'issues' ||
      github.event.schedule == '*/30 * * * *' ||
      (github.event_name == 'workflow_dispatch' && (inputs.job == 'heartbeat' || inputs.job == 'all'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Read owner commands (kill switch / resume / messages), regenerate dashboard, run validators
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/heartbeat.py
      - name: Commit state changes
        run: |
          git config user.name "RIO" && git config user.email "rio@rio-affiliate.bot"
          git add -A && (git diff --cached --quiet || git commit -m "heartbeat: refresh dashboard + validators") && git pull --rebase --autostash && git push

  content-review:
    if: |
      github.event.schedule == '0 5 * * *' ||
      (github.event_name == 'workflow_dispatch' && (inputs.job == 'content-review' || inputs.job == 'all'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: DeepSeek reviews RIO's live articles
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: python scripts/content_review.py
        continue-on-error: true
      - name: Commit report
        run: |
          git config user.name "RIO" && git config user.email "rio@rio-affiliate.bot"
          git add -A && (git diff --cached --quiet || git commit -m "content review: DeepSeek pass over live articles") && git pull --rebase --autostash && git push

  discover-products:
    if: |
      github.event.schedule == '30 5 * * *' ||
      (github.event_name == 'workflow_dispatch' && (inputs.job == 'discover-products' || inputs.job == 'all'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: DeepSeek product discovery suggestions
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: python scripts/discover_products.py
        continue-on-error: true
      - name: Commit new DISCOVERY_REQUIRED candidates
        run: |
          git config user.name "RIO" && git config user.email "rio@rio-affiliate.bot"
          git add -A && (git diff --cached --quiet || git commit -m "discovery: DeepSeek search-query suggestions (DISCOVERY_REQUIRED only)") && git pull --rebase --autostash && git push

  instagram-publish:
    if: |
      (github.event_name == 'push' && github.actor != 'github-actions[bot]') ||
      github.event.schedule == '30 13 * * *' ||
      (github.event_name == 'workflow_dispatch' && (inputs.job == 'instagram-publish' || inputs.job == 'all'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Post the next Founder-approved verified offer to Instagram (@riosallerior)
        id: publish
        continue-on-error: true
        env:
          IG_USER_ID_RIO: ${{ secrets.IG_USER_ID_RIO }}
          IG_ACCESS_TOKEN_RIO: ${{ secrets.IG_ACCESS_TOKEN_RIO }}
        run: python scripts/publish_instagram.py
      - name: Commit publish state, including real failure reason
        if: always()
        run: |
          python scripts/generate_dashboard.py
          git config user.name "RIO" && git config user.email "rio@rio-affiliate.bot"
          git add -A && (git diff --cached --quiet || git commit -m "instagram: publish run") && git pull --rebase --autostash && git push
      - name: Keep the Actions result truthful when Meta publish failed
        if: steps.publish.outcome == 'failure'
        run: exit 1

  telegram-test:
    if: |
      github.event_name == 'workflow_dispatch' && (inputs.job == 'telegram-test' || inputs.job == 'all')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Send Telegram connection test to RIO Alerts
        env:
          TELEGRAM_BOT_TOKEN_RIO: ${{ secrets.TELEGRAM_BOT_TOKEN_RIO }}
          TELEGRAM_CHAT_ID_RIO: ${{ secrets.TELEGRAM_CHAT_ID_RIO }}
        run: python scripts/telegram_notify.py --test
