name: RIO

on:
  schedule:
    - cron: '*/30 * * * *'   # heartbeat: every 30 minutes (Vicky, 2026-08-17 via Dr. Victor)
    - cron: '0 5 * * *'      # content review: once daily, ~10:30 IST (DeepSeek reviews live articles)
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      job:
        description: 'Which job to run manually (heartbeat / content-review / all)'
        type: choice
        default: heartbeat
        options: [heartbeat, content-review, all]

permissions:
  contents: write
  issues: write

concurrency: rio-state

jobs:
  heartbeat:
    if: |
      github.event_name == 'issues' ||
      github.event.schedule == '*/30 * * * *' ||
      (github.event_name == 'workflow_dispatch' && (inputs.job == 'heartbeat' || inputs.job == 'all'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Read owner commands (kill switch / resume / messages), regenerate dashboard, run validators
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/heartbeat.py
      - name: Commit any changes (NOT [skip ci] — this intentionally re-triggers deploy-pages.yml so the live site reflects the refreshed dashboard)
        run: |
          git config user.name "RIO" && git config user.email "rio@rio-affiliate.bot"
          git add -A && (git diff --cached --quiet || git commit -m "heartbeat: refresh dashboard + validators") && git pull --rebase --autostash && git push

  content-review:
    if: |
      github.event.schedule == '0 5 * * *' ||
      (github.event_name == 'workflow_dispatch' && (inputs.job == 'content-review' || inputs.job == 'all'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: DeepSeek reviews RIO's live articles as a skeptical Indian online shopper (conversion/trust QA, not product discovery)
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: python scripts/content_review.py
        continue-on-error: true
      - name: Commit report (NOT [skip ci] — harmless if it retriggers deploy-pages.yml, data/ isn't part of the site build)
        run: |
          git config user.name "RIO" && git config user.email "rio@rio-affiliate.bot"
          git add -A && (git diff --cached --quiet || git commit -m "content review: DeepSeek pass over live articles") && git pull --rebase --autostash && git push
