name: Claude Direct Test

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  claude-direct-test:
    if: github.event.issue.title == '[RIO] CLAUDE DIRECT TEST'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Direct Anthropic API test
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL_RIO: ${{ vars.ANTHROPIC_MODEL_RIO }}
        run: python scripts/claude_direct_test.py
      - name: Commit sanitized result
        if: always()
        run: |
          git config user.name "RIO"
          git config user.email "rio@rio-affiliate.bot"
          git add data/claude_direct_test_result.json
          (git diff --cached --quiet || git commit -m "test: record Claude direct API result")
          git pull --rebase --autostash
          git push
