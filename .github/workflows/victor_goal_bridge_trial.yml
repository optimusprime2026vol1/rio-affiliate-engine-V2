name: Victor Goal Bridge Trial

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/victor_goal_bridge_trial.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  trial:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    concurrency:
      group: rio-heartbeat
      cancel-in-progress: false
    env:
      VICTOR_RIO_TASK_ID: victor-rio-goal-bridge-trial
      VICTOR_RIO_TASK_TYPE: GOAL_EXECUTE
      VICTOR_RIO_TASK_PAYLOAD: '{"requested_by":"victor","supervision_mode":"STRICT","execution_mode":"GOAL_EXECUTE","founder_message":"VICTOR GOAL CONTRACT — EXECUTE\nGoal ID: ORG-REVENUE-001\nTarget: Drive RIO toward verified commercial outcome and approved affiliate revenue.\nOperating rule: target fixed; HOW is delegated. Choose and execute the highest-impact valid next action within existing RIO authority."}'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}

      - name: Verify ACTIVE governed production state
        run: |
          python - <<'PY'
          import json
          d=json.load(open('data/production_control.json',encoding='utf-8'))
          assert d.get('production_state')=='ACTIVE', d
          assert d.get('operating_mode')=='GOVERNED_SELF_MODE', d
          print('PRODUCTION_GATE_PASS')
          PY

      - name: Revalidate Soul
        run: python scripts/soul_runtime.py

      - name: Execute one governed autonomous RIO business cycle
        env:
          TELEGRAM_BOT_TOKEN_RIO: ${{ secrets.TELEGRAM_BOT_TOKEN_RIO }}
          TELEGRAM_CHAT_ID_RIO: ${{ secrets.TELEGRAM_CHAT_ID_RIO }}
          AWS_BEDROCK_API_KEY: ${{ secrets.AWS_BEDROCK_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: python scripts/autonomous_business_cycle.py

      - name: Build Victor evidence envelope
        run: python scripts/victor_rio_task.py

      - name: Assert goal-execution semantics
        run: |
          python - <<'PY'
          import json
          p='integration/results/victor_tasks/victor-rio-goal-bridge-trial.json'
          d=json.load(open(p,encoding='utf-8')); s=d['strict_supervision']
          assert d['task_type']=='GOAL_EXECUTE', d
          assert d['governed_business_cycle_performed'] is True, d
          assert d['public_action_performed'] is False, d
          assert d['objective_changed'] is False, d
          assert d['credential_transfer_performed'] is False, d
          assert d['snapshot']['production_state']=='ACTIVE', d
          assert s['revert_to_victor'] is True, s
          assert s['status'] in {'GOAL_PROGRESS_VERIFIED','GOAL_PROGRESS_BLOCKED'}, s
          assert isinstance(s['requires_follow_up'], bool), s
          assert len(s['evidence']) >= 5, s
          print('GOAL_BRIDGE_EXECUTION_PASS')
          print(json.dumps({'status':s['status'],'next_action':s['next_action'],'outcome_progress':s.get('outcome_progress'),'evidence':s['evidence']},indent=2))
          PY

      - name: Persist trial evidence and autonomous changes
        run: |
          git config user.name "rio-victor-trial"
          git config user.email "actions@users.noreply.github.com"
          python scripts/stage_autonomous_changes.py
          git add integration/results/victor_tasks/victor-rio-goal-bridge-trial.json
          git diff --cached --quiet && exit 0
          git commit -m "test: persist Victor goal bridge trial evidence"
          git pull --rebase --autostash
          git push
