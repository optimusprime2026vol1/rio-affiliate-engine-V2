name: Bedrock Terra Direct Test

on:
  issues:
    types: [opened]

permissions:
  contents: write

jobs:
  bedrock-terra-direct-test:
    if: github.event.issue.title == '[RIO] BEDROCK TERRA DIRECT TEST'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Direct Bedrock Terra API test
        env:
          AWS_BEDROCK_API_KEY: ${{ secrets.AWS_BEDROCK_API_KEY }}
          AWS_BEDROCK_REGION: us-east-1
          AWS_BEDROCK_MODEL_RIO: openai.gpt-5.6-terra
        run: python scripts/bedrock_terra_direct_test.py
      - name: Commit sanitized result
        if: always()
        run: |
          git config user.name "RIO"
          git config user.email "rio@rio-affiliate.bot"
          git add data/bedrock_terra_direct_test_result.json
          (git diff --cached --quiet || git commit -m "test: record Bedrock Terra direct API result")
          git pull --rebase --autostash
          git push
