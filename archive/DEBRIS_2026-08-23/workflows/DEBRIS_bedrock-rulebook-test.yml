name: Bedrock Rulebook Test
on:
  issues:
    types: [opened]
permissions:
  contents: write
jobs:
  rulebook:
    if: github.event.issue.title == '[RIO] BEDROCK RULEBOOK TEST'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.x'}
      - env:
          AWS_BEDROCK_API_KEY: ${{ secrets.AWS_BEDROCK_API_KEY }}
        run: python scripts/bedrock_rulebook_test.py
      - run: |
          git config user.name "RIO AWS AI"
          git config user.email "rio@rio-affiliate.bot"
          git add 'data/Rule book.txt'
          git commit -m "bedrock: AI acknowledges Founder and Victor rules"
          git pull --rebase --autostash
          git push
